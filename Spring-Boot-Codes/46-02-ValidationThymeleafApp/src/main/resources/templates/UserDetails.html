<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">
	<head>
		<title>UserDetails Page</title>
	</head>
	<body>
		<hr style = "color: blue">
		<h3>User Details</h3>
		<p>Username: <span th:text="${username}"></span></p>
		<p>Email: <span th:text="${email}"></span></p>
		<p>Mobile: <span th:text="${mobile}"></span></p>
		<p>Gender: <span th:text="${gender}"></span></p>
		<p>Date of Birth: <span th:text="${dob}"></span></p>
		<hr style = "color: red">
	</body>
</html>
